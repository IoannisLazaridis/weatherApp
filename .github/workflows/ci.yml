name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npx eslint . --format stylish
      - name: Prettier
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Vitest with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: matrix.node == 22
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Test coverage", "", "| Metric | % | Covered |", "| --- | --- | --- |",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: coverage
          path: coverage
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  build:
    name: Build & Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle size
        run: |
          {
            echo "### Bundle size"
            echo ""
            echo "| File | Size | Gzip |"
            echo "| --- | --- | --- |"
            for f in dist/assets/*.js dist/assets/*.css; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | $(gzip -c "$f" | wc -c | awk '{printf "%.1fK", $1/1024}') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
